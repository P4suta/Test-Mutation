name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      # The audit tool builds PerlIO::gzip, which needs the zlib headers.
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - run: mise run check

  driver:
    name: driver on Perl ${{ matrix.perl }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.36"
          - "5.40"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # t/e2e/second-perl.t runs the tests of a fixture on this interpreter under the driver of the matrix.
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.10"
      - run: echo "PERMUTL_SECOND_PERL=$(command -v perl)" >> "$GITHUB_ENV"
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
          # cpm reads cpanfile.snapshot through this module.
          install-modules: Carton::Snapshot
      - run: cpm install --top-level-phase configure,build,test,runtime
      - run: prove -lr t/unit t/shim t/assumptions t/e2e

  shim:
    name: shim on Perl ${{ matrix.perl }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.10"
          - "5.16"
          - "5.26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
          # The shim tests use subtests, which the Test::More bundled with Perl 5.10 lacks.
          install-modules: Test::More
      - run: prove -l t/shim
