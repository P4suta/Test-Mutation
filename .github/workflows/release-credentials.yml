name: Check release credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Check access to the release proposal repository
    if: github.repository == 'P4suta/Test-Mutation' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-please
    steps:
      - id: doppler
        uses: DopplerHQ/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: false
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ steps.doppler.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Check the installation token for this repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          gh api /installation/repositories |
            jq --exit-status --arg repository "$GITHUB_REPOSITORY" \
              '.total_count == 1 and (.repositories | length == 1) and .repositories[0].full_name == $repository' >/dev/null

  cpan:
    name: Check token delivery and public indexing permissions
    if: github.repository == 'P4suta/Test-Mutation' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cpan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: xt/release-publish/pause.rs
          sparse-checkout-cone-mode: false
      - name: Compile the adapter from protected main
        run: rustc --edition=2021 -D warnings xt/release-publish/pause.rs -o "$RUNNER_TEMP/pause"
      - id: doppler
        uses: DopplerHQ/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: false
      - name: Verify local token format and public records without authenticating to PAUSE
        env:
          PAUSE_TOKEN: ${{ steps.doppler.outputs.PAUSE_TOKEN }}
        run: '"$RUNNER_TEMP/pause" preflight'
