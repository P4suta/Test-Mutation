name: release gate

on:
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  self-measurement:
    name: Self measurement ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - name: Measure one part of the inventory
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: mise run mutation -- --no-cache --shard "${SHARD}/${SHARDS}" --format json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-mutation-${{ matrix.shard }}
          path: mutation-report/mutation.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Engine, interpreters and real distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - run: mise run check
      - run: mise run discover-mutants
      - run: mise run release-compatibility

  release:
    name: Complete self measurement and Linux distribution
    needs: [self-measurement, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: self-mutation-*
          path: shard-reports
      - run: mise run mutation -- merge shard-reports/*/mutation.json --format json --format terminal --report-dir mutation-report --min-score 100
      - run: mise x -- prove -l xt/release
      - run: mise run dist
      - run: mise x -- make disttest

  macos:
    name: macOS distribution
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: mise run setup
      - run: mise run check
      - run: mise run discover
      - run: mise run dist
      - run: mise x -- make disttest
