name: release gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Candidate commit SHA (defaults to the dispatched commit)
        type: string
      version:
        description: Expected Perl package version (defaults to the candidate version)
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: Full candidate commit SHA
        type: string
        required: true
      version:
        description: Expected Perl package version
        type: string
        required: true
    outputs:
      source_sha:
        description: Verified candidate commit
        value: ${{ jobs.verified.outputs.source_sha }}
      version:
        description: Verified Perl package version
        value: ${{ jobs.verified.outputs.version }}
      archive_name:
        description: CPAN distribution filename
        value: ${{ jobs.verified.outputs.archive_name }}
      archive_sha256:
        description: SHA-256 of the tested tar.gz bytes
        value: ${{ jobs.verified.outputs.archive_sha256 }}
      artifact_id:
        description: Immutable Actions artifact containing the tested archive
        value: ${{ jobs.verified.outputs.artifact_id }}

concurrency:
  group: release-gate-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  candidate:
    name: Check the candidate commit and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require a main controller and an immutable source
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version=$(perl -ne 'print "$1\n" if /^our \$VERSION\s*=\s*\x27([0-9]+\.[0-9]+)\x27;\s*$/' lib/Test/Mutation.pm)
          [[ "$version" =~ ^(0|[1-9][0-9]*)[.][0-9]+$ ]] || exit 1
          [[ -z "$VERSION" || "$VERSION" == "$version" ]] || exit 1
          printf 'source_sha=%s\nversion=%s\n' "$SOURCE_SHA" "$version" >> "$GITHUB_OUTPUT"

  self-runtime:
    name: Prepare the self-measurement runtime
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISE_DATA_DIR: /tmp/test-mutation-release-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - name: Pack Perl and the installed dependencies
        run: |
          runtime="$RUNNER_TEMP/self-runtime"
          mkdir -p "$runtime"
          install="$(mise where perl)"
          perl="$(mise which perl)"
          case "$install" in "$MISE_DATA_DIR"/*) ;; *) exit 1 ;; esac
          case "$perl" in "$install"/*) ;; *) exit 1 ;; esac
          tar -czf "$runtime/perl.tar.gz" -C "$MISE_DATA_DIR" "${install#"$MISE_DATA_DIR"/}"
          tar -czf "$runtime/libraries.tar.gz" local
          printf '%s\n' "${perl#"$MISE_DATA_DIR"/}" > "$runtime/perl-path"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-runtime
          path: ${{ runner.temp }}/self-runtime
          if-no-files-found: error
          retention-days: 1

  self-measurement:
    name: Self measurement ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    needs: self-runtime
    env:
      MISE_DATA_DIR: /tmp/test-mutation-release-tools
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-runtime
          path: ${{ runner.temp }}/self-runtime
      - name: Restore the prepared runtime
        run: |
          mkdir -p "$MISE_DATA_DIR"
          tar -xzf "$RUNNER_TEMP/self-runtime/perl.tar.gz" -C "$MISE_DATA_DIR"
          tar -xzf "$RUNNER_TEMP/self-runtime/libraries.tar.gz"
      - name: Measure one part of the inventory
        id: measure
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          IFS= read -r executable < "$RUNNER_TEMP/self-runtime/perl-path"
          perl="$MISE_DATA_DIR/$executable"
          env -i LC_ALL=C TZ=UTC PATH="${perl%/*}:$PWD/local/bin:/usr/bin:/bin" PERL5LIB="$PWD/local/lib/perl5" \
            "$perl" -Ilib bin/mutation --no-cache --shard "$SHARD/$SHARDS" --format json --format terminal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure') }}
        with:
          name: self-mutation-${{ matrix.shard }}
          path: mutation-report/mutation.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Engine, interpreters and real distributions
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - run: mise run check
      - run: mise run discover-mutants
      - run: mise run release-compatibility

  release:
    name: Complete self measurement and Linux distribution
    needs: [candidate, self-measurement, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      archive_sha256: ${{ steps.tested.outputs.sha256 }}
      build_attempt: ${{ steps.tested.outputs.build_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: sudo apt-get install --yes --no-install-recommends zlib1g-dev
      - run: mise run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: self-mutation-*
          path: shard-reports
      - run: mise run mutation -- merge shard-reports/*/mutation.json --format json --format terminal --report-dir mutation-report --min-score 100
      - run: mise x -- prove -l xt/release
      - run: mise run dist
      - name: Record the archive to install
        id: tested
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          archive="Test-Mutation-$VERSION.tar.gz"
          test -f "$archive"
          test ! -L "$archive"
          digest=$(sha256sum -- "$archive")
          printf 'archive=%s\nsha256=%s\nbuild_attempt=%s\n' "$archive" "${digest%% *}" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - run: mise x -- make disttest
      - run: mise run verify-install
        env:
          TEST_MUTATION_DISTRIBUTION: ${{ steps.tested.outputs.archive }}
      - name: Upload the installed CPAN archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpan-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.tested.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    name: macOS distribution
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: mise run setup
      - run: mise run check
      - run: mise run discover
      - run: mise run dist
      - run: mise x -- make disttest
      - run: mise run verify-install

  verified:
    name: Bind the tested archive to its source and build
    needs: [candidate, release, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Read the artifact's build run and immutable ID.
      contents: read # Read the controller and candidate commits separately.
    outputs:
      source_sha: ${{ needs.candidate.outputs.source_sha }}
      version: ${{ needs.candidate.outputs.version }}
      archive_name: ${{ steps.verify.outputs.archive_name }}
      archive_sha256: ${{ steps.verify.outputs.archive_sha256 }}
      artifact_id: ${{ needs.release.outputs.artifact_id }}
    steps:
      - name: Check the artifact belongs to the selected run and attempt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          BUILD_ATTEMPT: ${{ needs.release.outputs.build_attempt }}
        shell: bash
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          name="cpan-$SOURCE_SHA-$GITHUB_RUN_ID-$BUILD_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -se --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg id "$ARTIFACT_ID" '
              length == 1 and (.[0] | .name == $name and (.id | tostring) == $id
                and (.workflow_run.id | tostring) == $run and .expired == false)' > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: distribution
          digest-mismatch: error
      - id: verify
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          SHA256: ${{ needs.release.outputs.archive_sha256 }}
        run: |
          shopt -s nullglob dotglob
          archives=(distribution/*)
          test "${#archives[@]}" = 1
          test -f "${archives[0]}"
          test ! -L "${archives[0]}"
          perl controller/xt/bin/verify-release-archive source "$SOURCE_SHA" "$VERSION" "${archives[0]}" "$SHA256" >> "$GITHUB_OUTPUT"
